<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Análise de Trabalho - Ecommerce na Prática</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-page:#F4F7FB;--bg-card:#FFFFFF;--bg-card-inner:#F4F7FB;
  --text-heading:#313642;--text-body:#5C6167;--text-body-strong:#313642;
  --text-meta:#979BA1;--accent:#1076DD;--accent-hover:#0A5BB5;
  --link:#1076DD;--link-hover:#313642;--divider:#BDC0C6;
  --gray-10:#EFF1F4;--gray-20:#BDC0C6;--gray-40:#979BA1;
  --gray-60:#5C6167;--gray-80:#303339;
  --nature-green:#00CD4B;--dawn-orange:#FF7A27;--sunset-pink:#C3355D;
  --lime:#CDFF07;--sky:#31B3F9;
  --shadow-card:0 24px 48px -12px rgba(50,50,93,.1),0 18px 36px -18px rgba(0,0,0,.1),0 -12px 36px -8px rgba(0,0,0,.02);
  --shadow-soft:0 10px 30px rgba(0,0,0,.05);
  --radius-card:16px;--radius-input:6px;--radius-pill:100px;
  --ease-expo:cubic-bezier(.19,1,.22,1);
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Helvetica Neue",arial,sans-serif;
}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font);background:var(--bg-page);color:var(--text-body);line-height:1.5;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.shell{display:flex;flex:1;overflow:hidden}
.sidebar{width:270px;background:var(--bg-card);overflow-y:auto;flex-shrink:0;padding:0 0 16px;border-right:1px solid var(--gray-10);transition:transform .3s var(--ease-expo)}
.sidebar__header{padding:22px 20px 16px;border-bottom:1px solid var(--gray-10);margin-bottom:8px}
.sidebar__title{font-weight:600;font-size:15px;color:var(--text-heading);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sidebar__title img{width:19px;height:22px;flex-shrink:0}
.sidebar__sub{font-size:12px;color:var(--text-meta);margin-top:4px}
.sidebar__sub span{color:var(--accent);background:rgba(16,118,221,.08);padding:1px 8px;border-radius:var(--radius-pill);margin-left:4px}
.nav__group{padding:0 12px;margin-bottom:2px}
.nav__toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;font-family:var(--font);font-size:14px;font-weight:600;color:var(--text-heading);background:none;border:none;padding:11px 12px;cursor:pointer;border-radius:var(--radius-input);text-align:left;transition:background .15s ease}
.nav__toggle:hover{background:var(--gray-10)}
.nav__toggle.open{color:var(--accent)}
.nav__caret{font-size:9px;color:var(--text-meta);transition:transform .25s var(--ease-expo);flex-shrink:0}
.nav__toggle.open .nav__caret{transform:rotate(90deg);color:var(--accent)}
.nav__sub{overflow:hidden;max-height:0;transition:max-height .3s var(--ease-expo)}
.nav__sub.open{max-height:640px}
.nav__sub-inner{padding:2px 0 8px 8px}
.sidebar__item{font-size:14px;color:var(--text-body);padding:8px 12px;border-radius:var(--radius-input);cursor:pointer;transition:all .15s ease;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar__item:hover{background:var(--gray-10);color:var(--text-heading)}
.sidebar__item.active{background:rgba(16,118,221,.08);color:var(--accent);font-weight:600}
.content{flex:1;overflow-y:auto;padding:40px;scroll-behavior:smooth}
.content__inner{max-width:800px;margin:0 auto}
.section{display:none;animation:fadeIn .4s var(--ease-expo)}
.section.visible{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:clamp(30px,4vw,42px);font-weight:600;color:var(--text-heading);letter-spacing:-.025em;line-height:1.1;margin-bottom:8px}
h2{font-size:clamp(22px,3vw,30px);font-weight:600;color:var(--text-heading);letter-spacing:-.02em;line-height:1.2;margin-bottom:16px}
h3{font-size:22px;font-weight:600;color:var(--text-heading);letter-spacing:-.01em;line-height:1.3;margin-bottom:12px;margin-top:8px}
h4{font-size:16px;font-weight:600;color:var(--text-heading);margin-bottom:8px}
p{margin-bottom:16px;font-size:16px;line-height:1.6}
.lead{font-size:18px;color:var(--text-body);margin-bottom:24px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-meta);margin-bottom:8px}
strong{font-weight:600;color:var(--text-body-strong)}
em{font-style:normal;color:var(--accent)}
.card{background:var(--bg-card);border-radius:var(--radius-card);padding:32px;margin-bottom:24px;box-shadow:var(--shadow-soft)}
.card--inner{background:var(--bg-card-inner);border-radius:var(--radius-card);padding:24px;margin-bottom:16px}
.card--accent{border-left:3px solid var(--accent);padding-left:29px}
.card--warn{border-left:3px solid var(--dawn-orange);padding-left:29px}
.card--danger{border-left:3px solid var(--sunset-pink);padding-left:29px}
.card--success{border-left:3px solid var(--nature-green);padding-left:29px}
.card--tight{padding:20px 24px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;margin-bottom:24px;font-size:14px}
thead{background:rgba(49,54,66,.07)}
th{text-align:left;padding:12px 16px;font-weight:600;color:var(--text-heading);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
td{padding:12px 16px;border-bottom:1px solid rgba(49,54,66,.06);color:var(--text-body);vertical-align:top}
tbody tr:nth-child(even){background:rgba(49,54,66,.03)}
tbody tr:hover{background:rgba(16,118,221,.04)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:32px;white-space:nowrap}
.badge--blue{background:rgba(16,118,221,.1);color:var(--accent)}
.badge--green{background:rgba(0,205,75,.1);color:#00974a}
.badge--orange{background:rgba(255,122,39,.1);color:#cc5500}
.badge--pink{background:rgba(195,53,93,.1);color:var(--sunset-pink)}
.badge--gray{background:var(--gray-10);color:var(--gray-60)}
ul,ol{margin-bottom:16px;padding-left:24px}
li{margin-bottom:8px;font-size:15px;line-height:1.5}
li::marker{color:var(--accent)}
blockquote{background:var(--bg-card-inner);border-left:3px solid var(--accent);padding:16px 24px;margin:0 0 24px;border-radius:0 var(--radius-input) var(--radius-input) 0;font-size:15px;color:var(--text-body)}
hr{border:none;height:1px;background:var(--gray-10);margin:32px 0}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--text-heading);text-decoration:underline}
code{font-family:monospace;font-size:13px;background:var(--gray-10);padding:1px 6px;border-radius:4px;color:var(--text-body-strong)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;text-align:center}
.kpi{padding:8px 0}
.kpi__value{font-size:30px;font-weight:600;color:var(--accent)}
.kpi__label{font-size:12px;color:var(--text-meta)}
.sitelink{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--accent);background:rgba(16,118,221,.08);padding:9px 18px;border-radius:var(--radius-pill);margin-bottom:20px;transition:background .15s ease}
.sitelink:hover{background:rgba(16,118,221,.16);text-decoration:none;color:var(--accent)}
.jumptable tbody tr{cursor:pointer}
.jumptable td:first-child{white-space:nowrap}
.jumptable td:first-child strong{color:var(--accent)}
.jumptable td:last-child{white-space:nowrap}
@media(max-width:768px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:1045;transform:translateX(-100%);width:280px;box-shadow:4px 0 12px rgba(0,0,0,.08)}
  .sidebar.open{transform:translateX(0)}
  .content{padding:64px 16px 24px}
  .burger{display:flex!important}
  .jumptable thead{display:none}
  .jumptable,.jumptable tbody{display:block;width:100%}
  .jumptable tr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:14px 4px;border-bottom:1px solid rgba(49,54,66,.08);background:transparent!important}
  .jumptable td{display:block;padding:0;border:none;white-space:normal!important}
  .jumptable td:first-child{order:1;flex:1;font-size:15px}
  .jumptable td:last-child{order:2}
  .jumptable td:nth-child(2){order:3;flex-basis:100%;font-size:13px;line-height:1.5;color:var(--text-body)}
}
.burger{display:none;position:fixed;top:12px;left:12px;z-index:1050;align-items:center;justify-content:center;width:44px;height:44px;background:var(--bg-card);border:none;border-radius:var(--radius-input);box-shadow:var(--shadow-soft);cursor:pointer;color:var(--text-heading);font-size:20px}
.overlay{display:none;position:fixed;inset:0;background:rgba(13,27,46,.3);z-index:1040}
.overlay.open{display:block}
</style>
</head>
<body>

<button class="burger" onclick="toggleSidebar()" aria-label="Menu">&#9776;</button>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="shell">
<aside class="sidebar" id="sidebar">
  <div class="sidebar__header">
    <div class="sidebar__title"><img src="https://marca.ecommercenapratica.com/images/logos/simbolo-azul-ecommerce-na-pratica.svg" alt="Ecommerce na Prática">Análise de Trabalho</div>
    <div class="sidebar__sub">Ecommerce na Prática <span>jul/26</span></div>
  </div>
  <nav id="nav"></nav>
</aside>
<main class="content" id="content"></main>
</div>

<script>
const DATA = {
visao: {
  label: 'Visão Geral',
  sections: {
    resumo: { title: 'Resumo Executivo', html: `
      <div class="eyebrow">Julho de 2026</div>
      <h1>Resumo Executivo</h1>
      <p class="lead">Este documento analisa o trabalho desenvolvido para o Ecommerce na Prática, da concepção de marca à engenharia que a sustenta.</p>
      <h2>Os 7 projetos em destaque</h2>
      <table class="jumptable">
        <thead><tr><th>Projeto</th><th>O que é</th><th>Status</th></tr></thead>
        <tbody>
          <tr onclick="go('destaques','ds')"><td><strong>EnP Design System</strong></td><td>A identidade da marca como código, aplicada por agentes de IA e pessoas</td><td><span class="badge badge--green">Em uso</span></td></tr>
          <tr onclick="go('destaques','marca')"><td><strong>Guia de Marca Online</strong></td><td>Site público da identidade visual, para times e parceiros</td><td><span class="badge badge--green">No ar</span></td></tr>
          <tr onclick="go('destaques','photo')"><td><strong>IA Photo Studio</strong></td><td>Elenco de personagens sintéticos para a imagem da marca</td><td><span class="badge badge--green">Ativo</span></td></tr>
          <tr onclick="go('destaques','produto')"><td><strong>Produto</strong></td><td>Materiais interativos de ensino, produzidos pelo time e publicados via Vercel em produto.ecommercenapratica.com</td><td><span class="badge badge--green">Em produção</span></td></tr>
          <tr onclick="go('destaques','conhecimento')"><td><strong>Plataforma de Conhecimento</strong></td><td>Fonte de verdade central da marca para pessoas e agentes</td><td><span class="badge badge--blue">Em construção</span></td></tr>
          <tr onclick="go('destaques','dataintel')"><td><strong>EnP Data Intel</strong></td><td>Inteligência de dados comportamentais com 4 fontes integradas</td><td><span class="badge badge--orange">Prova de conceito</span></td></tr>
          <tr onclick="go('destaques','hub')"><td><strong>EnP Hub de Criação</strong></td><td>Criação visual self-service dentro da identidade da marca</td><td><span class="badge badge--orange">Prova de conceito</span></td></tr>
        </tbody>
      </table>
      <p>O trabalho é distribuído em 29 repositórios que abrangem sistemas de marca, ferramentas de criação de conteúdo, plataformas de dados e conhecimento, e as páginas do ecossistema.</p>
      <p>O eixo é um <strong>Design System executável</strong>: a identidade da marca definida uma vez, em código, e distribuída para agentes de IA e para pessoas. O efeito é organizacional - times de produto e marketing produzem dentro da marca sem um designer em cada entrega, com materiais de ensino já no ar; sua face pública, o Guia de Marca, é usada internamente e acessível a parceiros.</p>
      <p>Ao redor, as ferramentas seguem um mesmo princípio - <em>o dado no centro, o código como pipeline reutilizável</em> - na geração de imagem de marca, na inteligência de dados e numa base de conhecimento central pensada como fonte de verdade para pessoas e agentes.</p>
      <div class="card card--accent"><p style="margin:0">O conjunto se divide com honestidade entre <strong>infraestrutura viva e em uso</strong> (Design System, Guia de Marca, materiais de ensino) e <strong>provas de conceito robustas ainda não adotadas</strong> (plataforma de dados, hub de criação) - que medem não a adoção, mas o teto de complexidade que um profissional alcança sozinho, com IA como par de engenharia e as decisões de arquitetura próprias.</p></div>
    `},
  }
},
destaques: {
  label: 'Projetos em Destaque',
  sections: {
    ds: { title: 'EnP Design System', html: `
      <div class="eyebrow"><span class="badge badge--green">Manutenção ativa</span> &middot; v3.3.0 &middot; usado por times de produto e marketing</div>
      <h2>EnP Design System</h2>
      <p class="lead">Governança de marca como código: um pacote de 5 skills instalável em agentes de IA (Claude Code, Antigravity e claude.ai via navegador) que faz qualquer pessoa do time - técnica ou não - produzir peças dentro da identidade EnP.</p>
      <div class="card card--accent"><p style="margin:0">Não é apenas documentação que o agente consulta: <strong>as regras se aplicam sozinhas na geração.</strong> Um pedido em linguagem natural ("faz uma landing pra EnP") ativa os tokens automaticamente, aplica 60 regras invioláveis consolidadas e pode disparar uma cadeia de validação em três passes (auditoria de violações &rarr; polish visual &rarr; revisão de microcopy na voz da marca). O agente é proibido de inventar valores fora do sistema.</p></div>
      <div class="card"><h4>Linhagem institucional</h4><p style="margin:0">Baseado no Nuvemshop Brand Design Guidelines; manteve tipografia e sistema de espaçamento, mas expandiu para 3 modos cromáticos próprios do EnP, gradientes nomeados, tokens de motion e semântica de cor validada por acessibilidade (WCAG).</p></div>
      <div class="card"><h4>Efeito organizacional</h4><p style="margin:0">Conteúdo da plataforma de ensino (produto.ecommercenapratica.com) é produzido pelo próprio time de produto; páginas do time de marketing são produzidas por eles. A revisão central passou a ser só técnica (otimização, formulários, integrações) - a consistência de marca deixou de depender de um designer no circuito de cada peça.</p></div>
      <div class="card"><h4>Fonte única da verdade</h4><p style="margin:0">Tokens, ícones, componentes e voz exportados em JSONs machine-readable que alimentam o site público da marca, eliminando divergência entre a especificação e a vitrine.</p></div>
      <div class="card"><h4>Em expansão de meio</h4><p style="margin:0">A versão atual (jun/2026) adicionou escala tipográfica para vídeo/motion, estendendo o sistema de web para broadcast.</p></div>
    `},
    marca: { title: 'Guia de Marca Online', html: `
      <div class="eyebrow"><span class="badge badge--green">Site no ar</span> &middot; usado por times internos e parceiros</div>
      <h2>Guia de Marca Online</h2>
      <a class="sitelink" href="https://marca.ecommercenapratica.com" target="_blank" rel="noopener noreferrer">marca.ecommercenapratica.com &rarr;</a>
      <p class="lead">A face humana do Design System. Enquanto o <code>enp-design-system</code> é a fonte da verdade que agentes de IA consomem (código, tokens, regras), o <strong>Guia de Marca é o site público onde pessoas navegam essa mesma identidade</strong> - vê a paleta, copia um HEX, testa um gradiente, baixa o logo.</p>
      <div class="card card--accent"><p style="margin:0">Um alimenta o outro: o guia lê os tokens do Design System, garantindo que a vitrine nunca divirja da especificação.</p></div>
      <p>Aplicação web com demonstrações ao vivo de toda a identidade visual do Ecommerce na Prática:</p>
      <div class="card"><h4>15 seções interativas</h4><p style="margin:0">Troca de modo cromático em tempo real (institucional, escuro, serviços) - cada cor com HEX, RGB e CMYK prontos para copiar.</p></div>
      <div class="card"><h4>Biblioteca completa</h4><p style="margin:0">Escala tipográfica com preview ao vivo, 19 gradientes nomeados, 206 ícones com busca em português e inglês, catálogo de wireframes por categoria, componentes interativos (botões e inputs em todos os estados) e tabelas de contraste com validação de acessibilidade.</p></div>
      <div class="card"><h4>Alcance externo</h4><p style="margin:0">Por ser um site público, serve de referência não só para os times internos, mas também para parceiros que precisam produzir dentro da identidade da marca.</p></div>
    `},
    photo: { title: 'IA Photo Studio', html: `
      <div class="eyebrow"><span class="badge badge--green">Ativo</span> &middot; em uso em peças publicadas</div>
      <h2>IA Photo Studio</h2>
      <p class="lead">Pipeline de geração de imagem que substitui o ensaio fotográfico tradicional por um elenco fixo de personagens sintéticos.</p>
      <p>Criado usando Claude Code para configurar e construir todo o pipeline em ComfyUI local (orquestrador dos inputs), gerando as imagens via API do Gemini 3 Pro Image - nativo em 4K, referência atual em consistência de identidade. Arquitetura altamente modularizada, desenhada para facilitar a troca de casting ou do modelo de IA que gera a imagem.</p>
      <blockquote>O princípio: <strong>personagem é dado, pipeline é código.</strong></blockquote>
      <div class="card"><h4>Estratégia embutida</h4><p style="margin:0">Cada personagem é rastreável a um ICP formal e a um recorte real da base pagante; os inputs selecionados (rosto, figurino, cenário) e um "passaporte visual" funcionam como chaves para a consistência de personagem e fazem a foto carregar posicionamento.</p></div>
      <div class="card"><h4>Custo</h4><p style="margin:0">Uma rodada completa do elenco (4 personagens &times; ~30 cenas &asymp; 120 imagens em 4K) custa entre US$ 14 e US$ 29, conforme preço público da API (US$ 0,12–0,24 por imagem).</p></div>
      <div class="card"><h4>Próximo passo</h4><p style="margin:0">Segunda rodada em preparo (direção fotográfica, expansão para outros ICPs); a mesma lógica é replicável em vídeo e áudio.</p></div>
      <div class="card"><h4>Curadoria</h4><p style="margin:0">A construção do casting permanece deliberadamente sob coordenação humana; a IA entra nos dados, no pipeline e no output, não na decisão editorial.</p></div>
      <div class="card card--warn"><h4>Em aberto</h4><p style="margin:0">Disclosure de imagem sintética; métrica de adoção das peças.</p></div>
    `},
    produto: { title: 'Produto (organização)', html: `
      <div class="eyebrow"><span class="badge badge--green">Em produção</span> &middot; materiais no ar para alunos &middot; produzido pelo time</div>
      <h2>Produto <span class="badge badge--gray">org e-commerce-na-pratica</span></h2>
      <p class="lead">Repositório central de materiais digitais do time de produto - e a prova operacional de que o modelo "Design System + IA" funciona além do seu autor. Aqui, quem produz é o time; a revisão central é apenas técnica.</p>
      <div class="card card--accent">
        <p style="margin:0">Os materiais complementares deixaram de ser PDFs estáticos e viraram HTML interativo. <strong>Já estão no ar, embedados na plataforma de ensino</strong>, dentro da jornada do aluno.</p>
        <p style="margin:12px 0 0"><a href="https://enp-produto.vercel.app/trilha-ia/aula-llms/" target="_blank" rel="noopener noreferrer">As principais LLMs e como configurá-las bem</a></p>
        <p style="margin:4px 0 0"><a href="https://enp-produto.vercel.app/trilha-ia/guia-prompts/" target="_blank" rel="noopener noreferrer">Prompts de IA para o seu E-commerce</a></p>
      </div>
      <div class="card"><h4>Produção descentralizada</h4><p style="margin:0">O material foi produzido pela analista de produto responsável pela trilha, usando as skills do EnP Design System no Claude Code; o resultado é 100% conforme as 60 regras da marca, com auditoria documentada (16 correções catalogadas).</p></div>
      <div class="card"><h4>Processo de engenharia aplicado a conteúdo</h4><p style="margin:0">O repositório inclui documento de continuidade com histórico de decisões por iteração, backlog priorizado com estimativas, riscos mapeados com mitigação e comandos de validação automática. Qualquer pessoa (ou agente) retoma o trabalho de onde parou.</p></div>
      <div class="card"><h4>Desenhado para escalar</h4><p style="margin:0">O primeiro material foi construído explicitamente como template: os próximos seguem a mesma estrutura e reutilizam os componentes já validados.</p></div>
    `},
    conhecimento: { title: 'Plataforma de Conhecimento', html: `
      <div class="eyebrow"><span class="badge badge--blue">Em construção</span> &middot; fundação recém-estabelecida &middot; fonte de verdade central</div>
      <h2>Plataforma de Conhecimento e Conteúdo <span class="badge badge--gray">enp-payload-test</span></h2>
      <p class="lead">O projeto de maior ambição estratégica do conjunto: uma <strong>base de conhecimento central do Ecommerce na Prática</strong> - voz da marca, público, posicionamentos, produtos, cases, citações de especialistas - que serve, ao mesmo tempo, o conteúdo público (site, blog, landing pages).</p>
      <p>Construída sobre Payload CMS + Next.js com banco próprio (PostgreSQL), sem mensalidade de plataforma nem dependência de fornecedor guardando os dados.</p>
      <div class="card card--accent"><p style="margin:0">O ponto-chave da arquitetura: <strong>o site é apenas um dos consumidores dessa base.</strong> A mesma informação é exposta por API e, na visão-alvo, por MCP - para que agentes de IA consultem o conhecimento oficial da empresa como fonte confiável, em vez de "inventar" a voz da marca a cada geração.</p></div>

let currentTab = 'visao';
let currentSection = null;

function buildNav() {
  const nav = document.getElementById('nav');
  let html = '';
  Object.keys(DATA).forEach(tabKey => {
    const tab = DATA[tabKey];
    html += '<div class="nav__group">';
    html += '<button class="nav__toggle" data-tab="' + tabKey + '">' + tab.label + '<span class="nav__caret">&#9654;</span></button>';
    html += '<div class="nav__sub" data-tab="' + tabKey + '"><div class="nav__sub-inner">';
    Object.keys(tab.sections).forEach(k => {
      html += '<div class="sidebar__item" data-tab="' + tabKey + '" data-section="' + k + '">' + tab.sections[k].title + '</div>';
    });
    html += '</div></div></div>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav__toggle').forEach(el => {
    el.addEventListener('click', () => showSection(el.dataset.tab, Object.keys(DATA[el.dataset.tab].sections)[0]));
  });
  nav.querySelectorAll('.sidebar__item').forEach(el => {
    el.addEventListener('click', () => showSection(el.dataset.tab, el.dataset.section));
  });
}

function showSection(tabKey, key) {
  if (!DATA[tabKey] || !DATA[tabKey].sections[key]) return;
  currentTab = tabKey;
  currentSection = key;
  document.getElementById('content').innerHTML = '<div class="content__inner"><div class="section visible">' + DATA[tabKey].sections[key].html + '</div></div>';
  document.getElementById('content').scrollTop = 0;
  document.querySelectorAll('.nav__toggle').forEach(el => el.classList.toggle('open', el.dataset.tab === tabKey));
  document.querySelectorAll('.nav__sub').forEach(el => el.classList.toggle('open', el.dataset.tab === tabKey));
  document.querySelectorAll('.sidebar__item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tabKey && el.dataset.section === key);
  });
  closeSidebar();
}

function go(tab, section) { showSection(tab, section); }

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSidebar();
  const sections = Object.keys(DATA[currentTab].sections);
  const ci = sections.indexOf(currentSection);
  if (e.key === 'ArrowDown' && ci < sections.length - 1) { e.preventDefault(); showSection(currentTab, sections[ci + 1]); }
  if (e.key === 'ArrowUp' && ci > 0) { e.preventDefault(); showSection(currentTab, sections[ci - 1]); }
});

buildNav();
showSection('visao', 'resumo');
</script>
